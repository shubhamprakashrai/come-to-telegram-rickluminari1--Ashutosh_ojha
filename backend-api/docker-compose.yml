services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ashutosh_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: law_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: ashutosh-law-api-backend:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ashutosh_admin:secure_password_123@db:5432/law_db
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-sa-key.json
    volumes:
      - ./firebase-sa-key.json:/app/firebase-sa-key.json:ro
    depends_on:
      - db

volumes:
  postgres_data:
